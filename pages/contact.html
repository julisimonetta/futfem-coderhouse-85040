<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../style/style.css">
    <meta name="description" content="Página de contacto, donde puedes encontrar información para comunicarte con nosotros.">
    <meta name="keywords" content="futbol femenino, Villa María, deportes, equipos locales, Córdoba, Argentina, noticias deportivas, comunidad deportiva">

    <meta property="og:description" content="Página de contacto, donde puedes encontrar información para comunicarte con nosotros.">
    <meta property="og:url" content="https://julisimonetta.github.io/futfem-coderhouse-85040/">
    <meta property="og:type" content="website">
    <title>FutFemVM - Contacto</title>
</head>
<body>
    <header class="navbar">
        <div class="menuAndIconContainer">
            <button class="btn menuBtn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <img src="../assets/icon-2.png" alt="FutfemHeaderIcon">
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close">X</button>
                </div>
                <div class="offcanvas-body">
                    <ul>
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="#" class="linkActive">Contacto</a></li>
                        <li><a href="./images.html">Imágenes</a></li>
                        <li><a href="./information.html">Información</a></li>
                        <li><a href="./products.html">Productos</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="socialMedia">
            <a target="_blank" href="https://www.facebook.com/profile.php?id=61558165752754"><img src="../assets/facebook.png" alt="facebook"></a>
            <a target="_blank" href="https://www.instagram.com/futfemvm/"><img src="../assets/instagram.png" alt="instagram"></a>
            <a target="_blank" href="https://www.youtube.com/@FutFemVM"><img src="../assets/youtube.png" alt="youtube"></a>
        </div>
    </header>
    <main class="mainContainer">
        <section class="textSection">
            <p>¿Tenés dudas, ideas o querés hacer algo personalizado? Escribinos sin vueltas. Nos encanta escuchar ideas nuevas y ayudarte con lo que necesites. Completá el formulario o mandanos un mensaje por redes. Te respondemos lo antes posible.</p>
        </section>
        <section class="formContainer">
            <form action="">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit" class="btn btnForm">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <div class="d-flex flex-row justify-content-around align-items-center partnerSliderImg">
                        <img src="../assets/partner1.png" alt="VillaMariaNoticias">
                        <img src="../assets/partner2.png" alt="PedroColombanoMuebles">
                        <img src="../assets/partner3.png" alt="BalladaresDiseñoYEstructura">
                        <img src="../assets/partner4.png" alt="SimonettaPromocionesYCobranzas">
                    </div>
                </div>
                <div class="carousel-item" data-bs-interval="10000">
                    <div class="d-flex flex-row justify-content-around align-items-center partnerSliderImg">
                        <img src="../assets/partner5.png" alt="AvellanedaFarmacia">
                        <img src="../assets/partner6.png" alt="EscuelaParqueNorte">
                        <img src="../assets/partner7.png" alt="PueblaRestaurante">
                        <img src="../assets/partner8.png" alt="SigmaCentroMedico">
                    </div>
                </div>

            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
